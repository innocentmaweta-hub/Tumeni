name: Universal Web Sync

on:
  push:
    branches:
      - main
      - master

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create destination repository
        env:
          GH_TOKEN: ${{ secrets.DESTINATION_GITHUB_TOKEN }}
        run: |
          DEST_OWNER="innocentmaweta-hub"
          DEST_REPO="innocent-maweta"

          echo "Checking destination repository..."

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$DEST_OWNER/$DEST_REPO)

          if [ "$STATUS" = "404" ]; then
            echo "Repository does not exist. Creating it..."

            curl -L \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/user/repos \
              -d "{\"name\":\"$DEST_REPO\",\"description\":\"Universal copy of Tumeni\",\"private\":false}"

            echo "Destination repository created."

          elif [ "$STATUS" = "200" ]; then
            echo "Destination repository already exists."

          else
            echo "Unable to check destination repository."
            echo "GitHub API returned HTTP $STATUS"
            exit 1
          fi

      - name: Push code to destination
        env:
          DESTINATION_GITHUB_TOKEN: ${{ secrets.DESTINATION_GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote remove destination 2>/dev/null || true

          git remote add destination \
            "https://${DESTINATION_GITHUB_TOKEN}@github.com/innocentmaweta-hub/innocent-maweta.git"

          git push destination --all --force
          git push destination --tags --force

          echo "Synchronization completed successfully."
