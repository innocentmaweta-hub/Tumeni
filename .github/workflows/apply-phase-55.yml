name: Apply Tumeni Phase 5.5

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: !contains(github.event.head_commit.message, 'Apply Phase 5.5 customer experience')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update customer experience
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          api = Path("src/services/tumeniApi.js")
          s = api.read_text()

          marker = "export async function getMyOrderItems("
          if marker not in s:
              anchor = "export async function getMyOrderHistory(orderId) {"
              fn = """export async function getMyOrderItems(orderId) {
                if (!supabase) return { data: [], error: new Error('Supabase is not configured.') };
                if (!orderId) return { data: [], error: new Error('Order ID is required.') };
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) return { data: [], error: new Error('Please sign in first.') };
                const { data, error } = await supabase
                  .from('order_items')
                  .select('id,order_id,product_id,product_name,unit_price,quantity,shop_id')
                  .eq('order_id', orderId)
                  .order('id');
                return { data: data || [], error };
              }

              """
              if anchor not in s:
                  raise SystemExit("Could not find order history anchor")
              s = s.replace(anchor, fn + anchor, 1)
              api.write_text(s)

          main = Path("src/main.jsx")
          s = main.read_text()

          old_import = "getMyOrders,getMyOrderHistory,getMyAddresses"
          new_import = "getMyOrders,getMyOrderItems,getMyOrderHistory,getMyAddresses"
          if old_import in s and new_import not in s:
              s = s.replace(old_import, new_import, 1)

          start = s.find("function Orders(")
          end = s.find("\nfunction TrackingHistory(", start)
          if start < 0 or end < 0:
              raise SystemExit("Orders component boundaries not found")

          orders_fn = r'''function Orders({setTab,onTracking,notice,cart,setCart,onCheckout,products}){const [orders,setOrders]=useState([]),[loading,setLoading]=useState(true),[error,setError]=useState(''),[activeTab,setActiveTab]=useState('cart'),[filter,setFilter]=useState('all'),[busy,setBusy]=useState('');const load=async()=>{setLoading(true);setError('');try{const r=await getMyOrders();if(r.error)throw r.error;setOrders(r.data||[])}catch(e){setError(e.message||'Could not load your orders.')}finally{setLoading(false)}};useEffect(()=>{void load()},[]);const statusLabel=s=>({pending_payment:'Awaiting payment',paid:'Payment successful',assigned:'Assigned',preparing:'Preparing',shopping:'At pickup',picked_up:'Picked up',on_the_way:'On the way',delivered:'Delivered',cancelled:'Cancelled',failed:'Payment failed',returned:'Returned',disputed:'Disputed',refund_requested:'Refund requested',refunded:'Refunded'}[s]||String(s||'').replaceAll('_',' '));const statusClass=s=>s==='paid'||s==='delivered'?'order-status-success':s==='failed'||s==='cancelled'||s==='refunded'?'order-status-failed':s==='pending_payment'?'order-status-pending':'order-status-active';const items=Object.values(cart).filter(x=>x.qty>0),subtotal=items.reduce((s,x)=>s+Number(x.product.price)*x.qty,0),delivery=items.length?2500:0,service=items.length?Math.round(subtotal*.05):0,total=subtotal+delivery+service;const change=(id,d)=>setCart(prev=>({...prev,[id]:{...prev[id],qty:Math.max(0,prev[id].qty+d)}}));const filteredOrders=orders.filter(o=>{if(filter==='shopping')return o.order_type==='purchase';if(filter==='tasks')return o.order_type==='task';if(filter==='delivered')return o.status==='delivered';if(filter==='cancelled')return ['cancelled','failed','refunded','returned'].includes(o.status);if(filter==='active')return !['delivered','cancelled','failed','refunded','returned'].includes(o.status);return true});const reorder=async order=>{setBusy(order.id);setError('');try{const r=await getMyOrderItems(order.id);if(r.error)throw r.error;if(!r.data?.length)throw new Error('No reorderable products were found for this order.');let added=0;for(const item of r.data){const p=(products||[]).find(x=>x.id===item.product_id)||{id:item.product_id,name:item.product_name,price:Number(item.unit_price),shop_id:item.shop_id,img:''};if(!p.id)continue;setCart(prev=>({...prev,[p.id]:{product:p,qty:(prev[p.id]?.qty||0)+Number(item.quantity||1)}}));added+=1}if(!added)throw new Error('The products from this order are no longer available.');setActiveTab('cart')}catch(e){setError(e.message||'Could not reorder this order.')}finally{setBusy('')}};return <div className="screen content orders-page"><Header title="My Tumeni"/><div className="orders-tabs"><button className={activeTab==='cart'?'active':''} onClick={()=>setActiveTab('cart')}>My cart{items.length>0&&<small>{items.length}</small>}</button><button className={activeTab==='orders'?'active':''} onClick={()=>setActiveTab('orders')}>My orders</button></div>{activeTab==='cart'?<>{!items.length?<div className="empty orders-empty"><div className="empty-icon"><Icon type="bag" size={28}/></div><h2>Your cart is empty</h2><p>Add a product or request a task.</p><button className="primary" onClick={()=>setTab('Home')}>Browse Tumeni</button></div>:<><div className="cart-list">{items.map(({product,qty})=><div className="cart-item" key={product.id}><img src={product.img||product.image_url} alt={product.name}/><div className="cart-info"><b>{product.name}</b>{product.shop&&<small>Partner: {product.shop}</small>}<strong>{money(product.price)}</strong><div className="qty"><button onClick={()=>change(product.id,-1)}><Icon type="minus" size={14}/></button><span>{qty}</span><button onClick={()=>change(product.id,1)}><Icon type="plus" size={14}/></button></div></div><button className="delete" onClick={()=>setCart(prev=>({...prev,[product.id]:{...prev[product.id],qty:0}}))}><Icon type="trash" size={16}/></button></div>)}</div><div className="summary"><div><span>Products</span><b>{money(subtotal)}</b></div><div><span>Tumeni service fee</span><b>{money(service)}</b></div><div><span>Delivery fee</span><b>{money(delivery)}</b></div><div className="total"><span>Total</span><b>{money(total)}</b></div></div><button className="primary full" onClick={()=>onCheckout({total,items,fees:{serviceFee:service,deliveryFee:delivery}})}>Checkout</button></>}</>:<>{notice&&<div className={notice.type==='success'?'success':notice.type==='pending'?'quote-note':'error'}>{notice.text}</div>}{error&&<div className="error">{error}</div>}{loading?<div className="orders-loading"><div className="orders-loading-icon"><Icon type="bag" size={25}/></div><h2>Loading your orders…</h2><p>Getting your latest purchases and delivery updates.</p></div>:!orders.length?<div className="empty orders-empty"><div className="empty-icon"><Icon type="bag" size={28}/></div><h2>No orders yet</h2><p>Your purchases and deliveries will appear here after you place an order.</p><button className="primary" onClick={()=>setTab('Home')}>Start shopping</button></div>:<><div className="order-filters">{[['all','All'],['shopping','Shopping'],['tasks','Tasks'],['active','Active'],['delivered','Delivered'],['cancelled','Cancelled']].map(([key,label])=><button key={key} className={filter===key?'active':''} onClick={()=>setFilter(key)}>{label}</button>)}</div><div className="order-list">{filteredOrders.map(o=><article className="order-card" key={o.id}><div className="order-card-head"><div className="order-heading"><span className="order-type">{o.order_type==='task'?'REQUEST':'PRODUCT ORDER'}</span><b>{o.order_number}</b><small>{new Date(o.created_at).toLocaleString()}</small></div><span className={`order-status ${statusClass(o.status)}`}><span className="order-status-dot"/>{statusLabel(o.status)}</span></div>{o.task_description&&<p className="order-description">{o.task_description}</p>}{o.delivery_address&&<div className="order-address"><Icon type="pin" size={15}/><span>{o.delivery_address.address_line}{o.delivery_address.area?', '+o.delivery_address.area:''}{o.delivery_address.city?', '+o.delivery_address.city:''}</span></div>}<div className="order-card-footer"><div><small>Total</small><b>{money(o.total)}</b></div><div className="order-card-actions"><button className="secondary order-track" onClick={()=>onTracking(o)}>View tracking <Icon type="chevron" size={14}/></button>{o.order_type==='purchase'&&<button className="secondary order-track" disabled={busy===o.id} onClick={()=>reorder(o)}>{busy===o.id?'Adding…':'Reorder'}</button>}</div></div></article>)}</div>{!filteredOrders.length&&<div className="empty compact"><h2>No matching orders</h2><p>Try another order-history filter.</p></div>}</>}</>}</div>}
'''
          s = s[:start] + orders_fn + s[end:]

          s = s.replace('onCheckout={x=>{setCheckout({...x});setPage(\'checkout\')}}/>;else if(page===\'tracking\')',
                        'onCheckout={x=>{setCheckout({...x});setPage(\'checkout\')}} products={products}/>;else if(page===\'tracking\')', 1)

          # Make address labels an explicit controlled set without changing the existing card design.
          s = s.replace('<label>Label<input value={label} onChange={e=>setLabel(e.target.value)} placeholder="Home"/></label>',
                        '<label>Label<select value={label} onChange={e=>setLabel(e.target.value)}><option>Home</option><option>Work</option><option>Campus</option><option>Other</option></select></label>', 1)

          # Add lightweight CSS only if not already present.
          css = Path("src/styles.css")
          c = css.read_text()
          if ".order-filters" not in c:
              c += """
.order-filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}.order-filters::-webkit-scrollbar{display:none}.order-filters button{white-space:nowrap;border:1px solid #e7e7e7;background:#fff;border-radius:999px;padding:8px 12px;font:inherit}.order-filters button.active{background:#111;color:#fff;border-color:#111}.order-card-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
"""
              css.write_text(c)

          # Remove this one-shot workflow after applying the changes.
          wf = Path(".github/workflows/apply-phase-55.yml")
          if wf.exists():
              wf.unlink()

          PY

          git config user.name "Tumeni Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/services/tumeniApi.js src/styles.css .github/workflows/apply-phase-55.yml
          git diff --cached --quiet && exit 0
          git commit -m "Apply Phase 5.5 customer experience"
          git push
